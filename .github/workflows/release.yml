  # ---------------- Windows ----------------
  windows:
    name: Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Resolve version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $v = $Matches[1] } else { $v = '0.1.0' }
          $p = $v.Split('.'); while ($p.Count -lt 3) { $p += '0' }
          "BUILD_NAME=$($p -join '.')" | Out-File -Append $env:GITHUB_ENV
          "BUILD_NUMBER=${{ github.run_number }}" | Out-File -Append $env:GITHUB_ENV
      - run: flutter build windows --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}

      - name: Zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $version = $Matches[1] } else { $version = 'dev' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\weiyue-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  # ---------------- Release ----------------
  release:
    name: Publish GitHub Release
    needs: [android, ios, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
