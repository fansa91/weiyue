name: weiyue
description: "微阅：访客态只读客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  dynamic_color: ^2.1.0
  extended_image_plus: ^10.1.0
  media_kit: ^1.2.1
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_ime: ^3.0.0
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^10.2.2

dependency_overrides:
  # flutter_inappwebview 已发布最新版 6.1.5（2024-10）的 Android 实现
  # flutter_inappwebview_android 1.1.3 在 build.gradle 里调用
  # getDefaultProguardFile('proguard-android.txt')，AGP 9 起已移除该文件，
  # CI 的 Android 构建在插件工程求值阶段直接失败。官方已在 master 修复
  # （改用 proguard-android-optimize.txt），但尚未发布正式版（master 为
  # 未发布的 1.2.0-beta 线）。这里把整个联邦包集合统一钉到包含该修复的
  # 上游提交，保证各平台实现与平台接口版本互相一致；待官方发布 6.2.0
  # 正式版后删除本段 override 回到 hosted 约束。
  flutter_inappwebview:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview
  flutter_inappwebview_platform_interface:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_platform_interface
  flutter_inappwebview_android:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_android
  flutter_inappwebview_ios:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_ios
  flutter_inappwebview_macos:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_macos
  flutter_inappwebview_web:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_web
  flutter_inappwebview_windows:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      ref: 634baa44e3dd9893649682e6a1440098878532c8
      path: flutter_inappwebview_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E6162D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
