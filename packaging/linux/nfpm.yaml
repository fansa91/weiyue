# nfpm 配置：用同一份文件打出 deb / rpm / archlinux(pacman) 三种包
# 用法：VERSION=1.0.0 nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist/
name: "netease-music"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "sound"
priority: "optional"
maintainer: "netease-music contributors"
description: "网易云音乐 Flutter 客户端"
vendor: "netease-music"
homepage: "https://github.com"
license: "MIT"
deb:
  fields:
    Depends: "libgtk-3-0"
contents:
  - src: build/linux/x64/release/bundle/netease_music
    dst: /usr/bin/netease-music
    file_info:
      mode: 0755
  - src: build/linux/x64/release/bundle/lib
    dst: /usr/lib/netease-music/lib
    type: tree
  - src: build/linux/x64/release/bundle/data
    dst: /usr/share/netease-music/data
    type: tree
  - src: packaging/linux/netease-music.desktop
    dst: /usr/share/applications/netease-music.desktop
  - src: packaging/linux/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/netease-music.png
